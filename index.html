            --text-dark: #333;
            --text-light: #666;

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text-dark);
            line-height: 1.618;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            width: 100%;
        }
        
        header {
            padding: 2.618rem 0;
            text-align: center;
        }
        
        h1 {

            font-size: 2.618rem;
            margin-bottom: 0.618rem;
            color: var(--text-dark);

        .subtitle {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 2.618rem;
        }
        
        .controls {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.618rem;
            margin-bottom: 2.618rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .search-box {
            width: 100%;
            padding: 0.618rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.618rem;
            font-size: 1rem;
            margin-bottom: 1.618rem;
            background: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(201, 168, 106, 0.2);
        }
        
        .tabs {
            display: flex;
            gap: 0.618rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        
        .tab {
            padding: 0.5rem 1.236rem;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .tab:hover {
            background: rgba(255, 255, 255, 0.9);
        }
        
        .tab.active {
            background: var(--rose);
            color: white;
            border-color: var(--gold);
        }
        
        .count {
            text-align: right;
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }
        
        .brands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
            gap: 1.618rem;
            margin-bottom: 4.236rem;
        }
        
        .brand-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.236rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .brand-card:hover {
            transform: translateY(-0.382rem);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.1);
        }
        
        .brand-card a {
            display: block;
            text-decoration: none;
            color: inherit;
        }
        
        .brand-name {
            font-family: 'Shippori Mincho', serif;
            font-size: 1.236rem;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }
        
        .brand-url {
            font-size: 0.8rem;
            color: var(--gold);
            word-break: break-all;
        }
        
        .no-results {
            text-align: center;
            padding: 4.236rem 0;
            color: var(--text-light);
            font-size: 1.236rem;
        }
        
        footer {
            margin-top: auto;
            padding: 1.618rem 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-light);
            border-top: 1px solid rgba(201, 168, 106, 0.3);
        }
        
        @media (max-width: 768px) {
            .brands-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

            4: {label: "大人 × 曲線", sub: "フェミニン／ソフトエレガント／エレガント"}
        };
        
        let currentFilter = 'all';
        let currentSearch = '';
        
        const searchInput = document.getElementById('searchInput');
        const tabs = document.getElementById('tabs');
        const brandsGrid = document.getElementById('brandsGrid');
        const countElement = document.getElementById('count');
        const noResults = document.getElementById('noResults');
        
        // 検索機能
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value.toLowerCase();
            renderBrands();
        });
        
        // タブフィルター
        tabs.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab')) {
                document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.cat;
                renderBrands();
            }
        });
        
        // ブランドのレンダリング
        function renderBrands() {
            let filteredBrands = BRANDS;
            
            // カテゴリフィルター
            if (currentFilter !== 'all') {
                filteredBrands = filteredBrands.filter(brand => brand.cat === parseInt(currentFilter));
            }
            
            // 検索フィルター
            if (currentSearch) {
                filteredBrands = filteredBrands.filter(brand => 
                    brand.name.toLowerCase().includes(currentSearch)
                );
            }
            
            // 件数表示
            countElement.textContent = `${filteredBrands.length}件`;
            
            // 結果表示
            if (filteredBrands.length === 0) {
                brandsGrid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            brandsGrid.style.display = 'grid';
            noResults.style.display = 'none';
            
            // カードの生成
            brandsGrid.innerHTML = '';
            filteredBrands.forEach(brand => {
                const card = document.createElement('div');
                card.className = 'brand-card';
                
                const link = document.createElement('a');
                link.href = brand.url;
                link.target = '_blank';
                link.rel = 'noopener';
                
                const name = document.createElement('div');
                name.className = 'brand-name';
                name.textContent = brand.name;
                
                const url = document.createElement('div');
                url.className = 'brand-url';
                url.textContent = brand.url;
                
                link.appendChild(name);
                link.appendChild(url);
                card.appendChild(link);
                brandsGrid.appendChild(card);
            });
        }
        
        // 初期レンダリング
        renderBrands();
    </script>
</body>
</html>
